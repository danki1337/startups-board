name: Discover ATS companies

# Previously this ran every provider inside a single job, walking them in a fixed order. The job hit
# its time limit long before the end of the list, so Getro and Spark Hire were never harvested at
# all (4 and 0 boards respectively, despite both having Common Crawl coverage) and only 2 of ~100
# CC indexes were ever scanned. Each provider now gets its own job and its own time budget.

on:
  schedule:
    - cron: "43 1 * * 0"
  workflow_dispatch:
    inputs:
      index_count:
        description: "How many Common Crawl indexes to scan"
        required: false
        default: "24"
        type: string
      # A re-scan is a real operation, not a one-off deletion of the ledger. The parser can change
      # in ways that make an already-covered page worth reading again -- isSharedHostIdentifier used
      # to reject any board slug containing a space, so every Ashby board registered under its
      # display name (jobs.ashbyhq.com/Solana%20Foundation, 9 open roles) was discarded at parse
      # time on pages this ledger then marked covered forever. Turning resume off is how those pages
      # get re-read, and it belongs here rather than in a commit that wipes the ledger.
      resume:
        description: "Skip pages already in the coverage ledger. Set false to re-scan after a parser fix."
        required: false
        default: true
        type: boolean
      # Narrow a re-scan to the providers a fix actually touches. The six that share a host and go
      # through isSharedHostIdentifier are ashby, greenhouse, lever, gem, rippling, smartrecruiters;
      # re-scanning workday or icims for a slug fix would burn hours for nothing.
      providers:
        description: 'JSON array of providers, e.g. ["ashby","greenhouse"]. Empty runs all twelve.'
        required: false
        default: ""
        type: string

concurrency:
  group: ats-company-discovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # A shard dying to Common Crawl throttling is an EXPECTED outcome this workflow already handles:
    # the checkpoint uploads with if: always() below, and merge runs with if: always() too, so its
    # partial results still reach the registry. Marking the job failed on top of that bought nothing
    # and cost a notification per shard -- twelve red emails for a run that did its job. The shard
    # records its outcome instead. A shard failing REPEATEDLY across runs is the real signal, and
    # `npm run ci:health` surfaces exactly that.
    continue-on-error: true
    strategy:
      fail-fast: false
      # Unlike the refresh matrix, every shard here talks to the SAME upstream -- Common Crawl's
      # shared CDX API -- and 12 concurrent shards got the runner IP throttled into HTTP 503s
      # (which is why most of the 2026-07-21 run failed). Three at a time stays under its limits;
      # the resumable coverage ledger means later shards lose nothing by waiting.
      max-parallel: 3
      matrix:
        provider: ${{ fromJSON(inputs.providers != '' && inputs.providers || '["icims","workday","greenhouse","lever","bamboohr","ashby","paylocity","gem","getro","sparkhire","rippling","smartrecruiters"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Each shard writes only its own provider's boards; the merge job unions them afterwards.
      - name: Harvest ${{ matrix.provider }}
        run: |
          node src/cli.mjs discover \
            --providers "${{ matrix.provider }}" \
            --index-count "${{ inputs.index_count || '24' }}" \
            --max-pages 25 \
            --max-urls-per-target 100000 \
            --merge-existing false \
            --resume-discovery "${{ inputs.resume == false && 'false' || 'true' }}" \
            --output "data/shard-${{ matrix.provider }}.json" \
            --discovery-state "data/discovery-state.json"

      - name: Record the outcome
        if: always()
        run: echo "- **${{ matrix.provider }}** — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

      # if: always() -- when a shard dies mid-run (Common Crawl throttling), the checkpoint file on
      # disk still holds everything found before the failure; upload it so the merge keeps it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.provider }}
          path: data/shard-${{ matrix.provider }}.json
          if-no-files-found: ignore
          retention-days: 7

  merge:
    needs: harvest
    # A provider that rate-limits or blocks CI should not discard the shards that did succeed.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: data/shards
          pattern: shard-*
          merge-multiple: true

      - name: Merge shards into the canonical registry
        run: node scripts/merge-registry-shards.mjs data/shards/shard-*.json

      - name: Commit the refreshed registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovered-boards.json data/discovery-state.json
          git diff --staged --quiet && exit 0
          git commit -m "Refresh ATS company registry"
          git pull --rebase origin main
          git push origin HEAD:main

      # Committing alone only updates git: production D1 received boards exactly once, at
      # provisioning, and every later harvest sat invisible in the repo. This pushes each week's
      # registry into the Worker; the upsert ignores boards that already exist, so re-sending the
      # full file costs one request per 2,000 rows and only new boards get queued for a crawl.
      - name: Import the registry into production
        env:
          ADMIN_IMPORT_URL: ${{ secrets.ADMIN_IMPORT_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node cloudflare/scripts/import-boards.mjs data/discovered-boards.json
