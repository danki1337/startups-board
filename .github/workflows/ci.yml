name: CI

# Nothing ran the test suite, the build, or the typechecker before this: the only workflows were
# the weekly data pipelines, so a broken build reached production with no automated resistance.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The root package has no dependencies -- the pipeline runs on stdlib Node -- but the test
      # suite loads the built worker from web/dist, so the frontend install is required.
      #
      # Plain `npm ci`. This used to pass --no-optional to stop the darwin-arm64 rolldown binding
      # from failing the Linux runner, which was the wrong read of the problem: rolldown ships its
      # native binding as fifteen platform-specific OPTIONAL dependencies, each tagged with its own
      # `os`/`cpu`, and npm already installs only the one that matches the host. --no-optional
      # skipped all fifteen, so the runner got no binding at all and every build died on
      # "Cannot find module '@rolldown/binding-linux-x64-gnu'".
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web (also produces the worker bundle the tests render)
        working-directory: web
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint web
        working-directory: web
        run: npm run lint --if-present
